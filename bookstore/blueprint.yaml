# ============================================================================
# File: The Bookstore App.yaml
# Author: Maher AlAsfar
# Email: maher.alasfar@broadcom.com
# Created: 2025-03-01
# Last Modified: 2026-08-01
# Description: VCFA 9.1 Blueprint to Deploy the bookstore e-commerce app on a newly provisoined VKS Cluster in an existing vSphere Namespace
# App repo : https://github.com/tmm-demo-apps/bookstore-app
# Version: 1.0
# ============================================================================
formatVersion: 2
name: The Bookstore App
version: 1.0
metadata:
  deploymentSettings:
    disableUpdateDay2Action: true
    hideDisabledDay2Actions: true
outputs:
  __deploymentOverview:
    value: |-
      ## Bookstore E-commerce Application
      A production-ready e-commerce platform built to demonstrate VMware Cloud Foundation (VCF) 9.0 capabilities. 
      Features enterprise-grade infrastructure including Elasticsearch search, Redis caching, MinIO object storage, 
      and real-world content from Project Gutenberg.

      ### Application Details

      **Bookstore Url   : ${resource.Bookstore_CM.object.data["bookstore-url"]}**

      **Reader Url      : ${resource.Bookstore_CM.object.data["reader-url"]}**

      **For more details:** check https://github.com/tmm-demo-apps/bookstore-app
           
inputs:
############################################
# Dynamic Data Retrieval for Known objects #
############################################
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vm_size:
    type: string
    title: Virtual Machine Class
    $data: /data/virtualmachineclasses?namespace={{namespace}}
  storageclass:
    type: string
    title: Storage Class
    $data: /data/storageclasses?namespace={{namespace}}
#############################################       
  vks_name:
    type: string
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    maxLength: 63
    minLength: 1
    title: VKS K8s Cluster Name
    description: ' Enter a name for the VKS K8s Cluster'
  controlPlaneCount:
    type: integer
    title: VKS ControlPlane Node count
    description: Control plane node count
    default: 1
    enum:
      - 1
      - 3
  minWorkerCount:
    type: string
    title: Min VKS Worker Node count
    description: Minimum VKS Worker node count
    default: '1'
    oneOf:
      - title: 1
        const: '1'
      - title: 2
        const: '2'
      - title: 3
        const: '3'
  maxWorkerCount:
    type: string
    title: Max VKS Worker Node count
    description: Maximum VKS Worker node count
    default: '3'
    oneOf:
      - title: 1
        const: '1'
      - title: 2
        const: '2'
      - title: 3
        const: '3'
      - title: 4
        const: '4'
      - title: 5
        const: '5'
  vksVersion:
    type: string
    title: VKS Version
    description: VKS Version
    oneOf:
      - title: v1.36.1
        const: v1.36.1---vmware.4-vkr.5
    default: v1.36.1---vmware.4-vkr.5
resources:
  Namespace:
    type: CCI.Supervisor.Namespace
    metadata:
      layoutPosition:
        - 1
        - 1
    properties:
      name: ${input.namespace}
      existing: true
  VKS-Job-SA:
    type: CCI.Supervisor.Resource
    metadata:
      layoutPosition:
        - 0
        - 0
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${input.vks_name}-vks-job-sa
  CM_Role:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS-Job-SA
    metadata:
      layoutPosition:
        - 1
        - 0
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${input.vks_name}-configmap-manager
        rules:
          - apiGroups:
              - ''
            resources:
              - configmaps
            verbs:
              - get
              - list
              - watch
              - create
              - delete
              - patch
  CM_Role_Binding:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CM_Role
    metadata:
      layoutPosition:
        - 2
        - 0
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${input.vks_name}-configmap-manager-binding
        subjects:
          - kind: ServiceAccount
            name: ${input.vks_name}-vks-job-sa
        roleRef:
          kind: Role
          name: ${input.vks_name}-configmap-manager
          apiGroup: rbac.authorization.k8s.io
  cert-manager-addon:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CM_Role_Binding
    metadata:
      layoutPosition:
        - 2
        - 1
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: addons.kubernetes.vmware.com/v1alpha1
        kind: AddonInstall
        metadata:
          name: ${input.vks_name}-cert-manager
        spec:
          addonRef:
            name: cert-manager
          clusters:
            - selector:
                matchLabels:
                  cluster.x-k8s.io/cluster-name: ${input.vks_name}
  istio-secret:
    type: CCI.Supervisor.Resource
    dependsOn:
      - cert-manager-addon
    metadata:
      layoutPosition:
        - 3
        - 1
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.vks_name}-istio-values
        stringData:
          values.yaml: |
            #@data/values
            #@overlay/match-child-defaults missing_ok=True
            ---
            gateways:
              ingress:
                enabled: true
  CLUSTER:
    type: CCI.Supervisor.Resource
    dependsOn:
      - istio-addon
    metadata:
      layoutPosition:
        - 4
        - 0
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - type: ControlPlaneInitialized
            status: 'True'
          - type: TopologyReconciled
            status: 'True'
          - type: WorkersAvailable
            status: 'True'
        fields:
          - indicatesFailure: false
            path: status.phase
            value: Provisioned
          - indicatesFailure: false
            path: status.initialization.controlPlaneInitialized
            value: 'true'
          - indicatesFailure: false
            path: status.initialization.infrastructureProvisioned
            value: 'true'
      manifest:
        apiVersion: cluster.x-k8s.io/v1beta2
        kind: Cluster
        metadata:
          name: ${input.vks_name}
          labels:
            cluster.x-k8s.io/cluster-name: ${input.vks_name}
        spec:
          clusterNetwork:
            pods:
              cidrBlocks:
                - 192.168.156.0/20
            services:
              cidrBlocks:
                - 10.96.0.0/12
            serviceDomain: cluster.local
          topology:
            classRef:
              name: builtin-generic-v3.7.0
              namespace: vmware-system-vks-public
            version: ${input.vksVersion}
            variables:
              - name: vmClass
                value: ${input.vm_size}
              - name: storageClass
                value: ${input.storageclass}
              - name: kubernetes
                value:
                  security:
                    podSecurityStandard:
                      audit: restricted
                      enforce: privileged
                      warn: restricted
            controlPlane:
              replicas: ${input.controlPlaneCount}
              metadata:
                annotations:
                  run.tanzu.vmware.com/resolve-os-image: os-name=photon
            workers:
              machineDeployments:
                - class: node-pool
                  name: ${input.vks_name}-np
                  metadata:
                    annotations:
                      cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: ${input.maxWorkerCount}
                      cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: ${input.minWorkerCount}
                      run.tanzu.vmware.com/resolve-os-image: os-name=photon
                  variables:
                    overrides:
                      - name: vmClass
                        value: ${input.vm_size}
  istio-addon:
    type: CCI.Supervisor.Resource
    dependsOn:
      - istio-secret
    metadata:
      layoutPosition:
        - 4
        - 1
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: addons.kubernetes.vmware.com/v1alpha1
        kind: AddonInstall
        metadata:
          name: ${input.vks_name}-istio
        spec:
          addonRef:
            name: istio
          addonConfigRef:
            name: ${input.vks_name}-istio-values
            kind: Secret
          clusters:
            - selector:
                matchLabels:
                  cluster.x-k8s.io/cluster-name: ${input.vks_name}
  VKS_Job:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CLUSTER
    metadata:
      layoutPosition:
        - 5
        - 0
    createTimeout: 600m
    properties:
      context: ${resource.Namespace.id}
      wait:
        conditions:
          - indicatesFailure: false
            status: 'True'
            type: Complete
        fields:
          - indicatesFailure: true
            path: status.failed
            value: '1'
      manifest:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: vks-job-${env.shortDeploymentId}
        spec:
          completions: 1
          parallelism: 1
          ttlSecondsAfterFinished: 600
          backoffLimit: 0
          template:
            spec:
              serviceAccountName: ${input.vks_name}-vks-job-sa
              containers:
                - name: vks-job
                  image: paif.packages.broadcom.com/tkg-gpu-console:9.0.0.0
                  #image: harbor-lvn.vpaif.net/paif-91-public/images/tkg-gpu-console:9.0.0.0
                  volumeMounts:
                    - name: cluster-kubeconfig-volume
                      mountPath: /etc/vks-kubeconfig
                      readOnly: true
                  command:
                    - /bin/bash
                    - '-c'
                  args:
                    - |
                      set -x
                      # Function to set KUBECONFIG to VKS KubeConfig
                      set_vks_kubeconfig() {
                        local kubeconfig_file="/etc/vks-kubeconfig/vks-cluster-kubeconfig-admin"

                        if [ ! -f "$kubeconfig_file" ]; then
                          echo "Failure: VKS kubeconfig file does not exist: $kubeconfig_file"
                          exit 1
                        fi

                        export KUBECONFIG="$kubeconfig_file"
                        echo "Success: VKS kubeconfig is set to $KUBECONFIG"
                      }

                      # Call the set_vks_kubeconfig() function
                      set_vks_kubeconfig

                      # get to verify current context 
                      #=========================================
                      kubectl config current-context

                      # Install git
                      #=========================================
                      apt update
                      apt install git -y

                      # Clone the bookstore repo to your jumpbox
                      #=========================================

                      #timeout 300 sh -c 'until git clone https://github.com/tmm-demo-apps/bookstore-app.git; do echo "git clone failed, retrying in 15 seconds..."; rm -rf bookstore-app; sleep 15; done' || exit 1
                      git clone https://github.com/tmm-demo-apps/bookstore-app.git
                      sleep 15
                      cd bookstore-app

                      # Build Helm dependencies
                      #=========================================         
                      helm dependency update ./helm/demo-suite

                      # Deploy bookstore application
                      #=========================================   
                      helm install -n default demo ./helm/demo-suite -f ./helm/demo-suite/values-small.yaml --set global.domain=dummy.local --set global.storageClassName=${input.storageclass} --set chatbot.enabled=false --set bookstore.image.pullPolicy=Always --set reader.epubSeed.enabled=true --set reader.image.pullPolicy=Always --timeout 10m

                      # 2. Wait for the LoadBalancer to get an IP from the infrastructure
                      echo "Waiting for Gateway IP..."
                      while [ -z "$(kubectl get svc demo-gateway-istio -n bookstore -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)" ]; do 
                        sleep 2 
                      done

                      # 3. Grab the IP
                      INGRESS_IP=$(kubectl get svc demo-gateway-istio -n bookstore -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
                      echo "Gateway IP is: $INGRESS_IP"

                      helm upgrade -n default demo ./helm/demo-suite -f ./helm/demo-suite/values-small.yaml --set global.domain=$INGRESS_IP.sslip.io --set global.storageClassName=${input.storageclass} --set chatbot.enabled=false --set bookstore.image.pullPolicy=Always --set reader.epubSeed.enabled=true --set reader.image.pullPolicy=Always --timeout 10m


                      # Echo Helm depoloyment completed
                      #=========================================                         
                      echo "Helm deployment completed"
                      # Echo Helm depoloyment completed
                      #=========================================                         
                      echo "Helm deployment completed"

                      # Create bookstore-endpoints ConfigMap on the parent Namespace
                      #============================================================= 
                      unset KUBECONFIG
                      kubectl create configmap ${input.vks_name}-bookstore-endpoints --from-literal=ingress-ip=$INGRESS_IP --from-literal=bookstore-url=https://bookstore.$INGRESS_IP.sslip.io --from-literal=reader-url=https://reader.$INGRESS_IP.sslip.io --dry-run=client -o yaml | kubectl apply -f -                      

                      # Enable / Disable Debug Mode to access the Job/pod running the script. DEBUG_MODE=true/false
                      #============================================================================================ 
                      DEBUG_MODE=false

                      if [ "$DEBUG_MODE" = true ]; then
                        echo "Pod entering debug mode — sleeping forever"
                      else
                        echo "Pod running normally — debug mode disabled"
                      fi

                      while $DEBUG_MODE; do
                        sleep 3600
                      done                      
              restartPolicy: Never
              volumes:
                - name: cluster-kubeconfig-volume
                  secret:
                    secretName: ${to_lower(input.vks_name)}-kubeconfig
                    items:
                      - key: value
                        path: vks-cluster-kubeconfig-admin
  Bookstore_CM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS_Job
    metadata:
      layoutPosition:
        - 6
        - 0
    properties:
      existing: true
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${input.vks_name}-bookstore-endpoints
